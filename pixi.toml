[workspace]
authors = ["Jainam1673 <jainamjadav1673@gmail.com>"]
channels = ['https://conda.modular.com/max', 'conda-forge']
name = "HyperForge"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
build = "mojo build -I src src/main.mojo -o hyperforge"
run = "mojo run -I src src/main.mojo"
test = "mojo run -I src tests/test_cli.mojo"
test-cli = "bash tests/integration_cli.sh"

[dependencies]
mojo = ">=1.2.0,<2"
max = ">=26.7,<27"
