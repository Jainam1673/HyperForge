[workspace]
authors = ["Jainam1673 <jainamjadav1673@gmail.com>"]
channels = ['https://conda.modular.com/max', 'conda-forge']
name = "HyperForge"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
build = "mojo build -I src src/main.mojo -o hyperforge"
run = "mojo run -I src src/main.mojo"
test = "mojo run -I src tests/test_cli.mojo && mojo run -I src tests/test_m01.mojo && mojo run -I src tests/test_m02.mojo && mojo run -I src tests/test_m03.mojo && mojo run -I src tests/test_m04.mojo && mojo run -I src tests/test_m05.mojo"
test-cli = "bash tests/integration_cli.sh"
test-experiment = "bash tests/integration_m01.sh"
test-automl = "bash tests/integration_m02.sh"
test-optimize = "bash tests/integration_m03.sh"
test-sinn = "bash tests/integration_m04.sh"
test-scit = "bash tests/integration_m05.sh"

[dependencies]
mojo = ">=1.2.0,<2"
max = ">=26.7,<27"
