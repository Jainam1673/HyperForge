test-cli = "bash tests/integration_cli.sh"
test-experiment = "bash tests/integration_m01.sh"
test-automl = "bash tests/integration_m02.sh"
test-optimize = "bash tests/integration_m03.sh"
test-sinn = "bash tests/integration_m04.sh"
test-scit = "bash tests/integration_m05.sh"
test-gpu = "bash tests/integration_m06.sh"
